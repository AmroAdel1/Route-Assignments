name: Deploy all projects to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Folder that contains your projects. Must match the real folder name exactly.
  #   "."            -> projects live directly in the repo root (project-1, project-2, ...)
  #   "simple-pages" -> projects live inside a wrapper folder
  PROJECTS_DIR: "."

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Assemble site (one URL per project folder)
        run: |
          set -e
          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          if [ ! -d "$PROJECTS_DIR" ]; then
            echo "Folder '$PROJECTS_DIR' not found. Fix PROJECTS_DIR in the workflow."
            exit 1
          fi

          mkdir -p _site
          LINKS=""

          for dir in "$PROJECTS_DIR"/*/; do
            name="$(basename "$dir")"
            case "$name" in _site|node_modules) continue ;; esac

            if [ -f "$dir/package.json" ]; then
              # Framework project (Vite, etc.): build it, publish dist
              echo "Building $name"
              (
                cd "$dir"
                if [ -f package-lock.json ]; then npm ci; else npm install; fi
                npm run build -- --base="/$REPO_NAME/$name/"
              )
              cp -r "$dir/dist" "_site/$name"
            else
              # Plain HTML/CSS/JS: publish as-is
              echo "Copying $name"
              cp -r "$dir" "_site/$name"
            fi

            LINKS="$LINKS<li><a href=\"./$name/\">$name</a></li>"
          done

          # Auto-generated home page listing every project
          echo "<!doctype html><meta charset=utf-8><title>Projects</title><h1>Projects</h1><ul>$LINKS</ul>" > _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
